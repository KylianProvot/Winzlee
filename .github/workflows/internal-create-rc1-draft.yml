name: Internal - stage RC1 draft without rebuilding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/internal-create-rc1-draft.yml'
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage empty private release draft for local validated uploads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0-rc1 >/dev/null 2>&1; then
            echo 'Release already exists. Not overwriting.'
            exit 0
          fi
          gh release create v1.0.0-rc1 \
            --target 14151a4497a12a0dfcc9519a9603a4a67210aa38 \
            --title 'Winzlee v1.0.0 RC1' \
            --notes-file docs/RELEASE-NOTES-v1.0.0-rc1.md \
            --draft --prerelease
          echo 'Draft created; owner must attach verified files from saved RC1 ZIP.'
