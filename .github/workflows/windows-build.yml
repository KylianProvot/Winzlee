name: Windows build validation

on:
  # Manual in the RC1 audit branch to avoid consuming GitHub Actions minutes
  # for every documentation or packaging commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Winzlee
        uses: actions/checkout@v4

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore app dependencies
        run: dotnet restore app/src/Filee.App/Filee.App.csproj

      - name: Compile Windows application
        run: dotnet build app/src/Filee.App/Filee.App.csproj --configuration Release --no-restore
