name: Winzlee RC1 - Windows validation, packages and draft release

on:
  # Keep heavy RC1 validation manual to preserve GitHub Actions minutes.
  workflow_dispatch:
    inputs:
      prepare_draft_release:
        description: "Create a private DRAFT RC1 release after all Windows tests pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: winzlee-${{ github.ref_name }}-stabilization
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Winzlee RC1
        uses: actions/checkout@v4
      - name: Check for accidentally tracked credentials
        shell: pwsh
        run: |
          & ./.github/scripts/check-credentials.ps1
          if ($LASTEXITCODE -ne 0) { throw "Credential preflight exit code: $LASTEXITCODE" }

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Assert RC1 version and update repository
        shell: pwsh
        run: |
          $props = [xml](Get-Content app/Directory.Build.props -Raw)
          if ($props.Project.PropertyGroup.Version -ne "1.0.0-rc1") {
            throw "RC1 workflow requires app version 1.0.0-rc1"
          }
          if ($props.Project.PropertyGroup.FileeRepositoryUrl -ne "https://github.com/KylianProvot/Winzlee-Public") {
            throw "Updater must target Winzlee-Public"
          }

      - name: Restore complete solution
        run: dotnet restore app/Filee.slnx
      - name: Provision pinned 7-Zip and Ghostscript before running tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./app/build/fetch-engines.ps1 -Only 7zip,ghostscript -Destination ./app/engines
          if (!(Test-Path "./app/engines/7zip/7z.exe")) { throw "7-Zip not provisioned" }
          if (!(Test-Path "./app/engines/ghostscript/gswin64c.exe")) { throw "Ghostscript not provisioned" }

      - name: Build ALL solution projects in Release configuration
        run: dotnet build app/Filee.slnx -c Release --no-restore

      - name: Updater regression tests including RC-to-stable transitions
        shell: pwsh
        run: |
          dotnet test app/tests/Filee.App.Tests/Filee.App.Tests.csproj -c Release --no-restore --no-build --filter "FullyQualifiedName~UpdateServiceTests"
          if ($LASTEXITCODE -ne 0) { throw "UpdateService regression" }

      - name: Fast localization and installer-selection regression checks
        shell: pwsh
        run: |
          dotnet test app/tests/Filee.App.Tests/Filee.App.Tests.csproj -c Release --no-restore --no-build --filter "FullyQualifiedName~PortugueseLocalizationTests.Catalogs_preserve_format_items_tokens_and_line_breaks"
          if ($LASTEXITCODE -ne 0) { throw "Portuguese localization regression" }
          dotnet test app/tests/Filee.Setup.Tests/Filee.Setup.Tests.csproj -c Release --no-restore --no-build --filter "FullyQualifiedName~SetupTextsTests.Chinese_installer_texts_use_no_fullwidth_colon_or_semicolon|FullyQualifiedName~SetupWindowTests.Choices_follow_the_checkboxes"
          if ($LASTEXITCODE -ne 0) { throw "Setup localization and default selection regression" }

      - name: Test ALL six projects without filters, saving TRX results
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $projects = @("Filee.App.Tests", "Filee.Core.Tests", "Filee.Engines.Tests",
                        "Filee.Cli.Tests", "Filee.Platform.Tests", "Filee.Setup.Tests")
          $failed = @()
          $resultFolder = Join-Path $env:RUNNER_TEMP "winzlee-test-results"
          New-Item -ItemType Directory -Force -Path $resultFolder | Out-Null
          foreach ($project in $projects) {
            Write-Host "::group::Full project $project"
            dotnet test "app/tests/$project/$project.csproj" -c Release --no-restore --no-build --blame-hang-timeout 5m --logger "trx;LogFileName=$project.trx" --results-directory $resultFolder
            if ($LASTEXITCODE -ne 0) { $failed += $project }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) { throw "Full test failures: $($failed -join ', ')" }

      - name: Keep full test reports even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Winzlee-RC1-audit-test-results
          path: ${{ runner.temp }}/winzlee-test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Smoke-test Windows Setup install, update and uninstall in sandbox
        shell: pwsh
        run: |
          & ./app/build/build-installer.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "Installer sandbox smoke test failed" }

      - name: Publish Winzlee portable Windows x64
        shell: pwsh
        run: |
          dotnet publish app/src/Filee.App/Filee.App.csproj -c Release -r win-x64 --self-contained true -p:FileeRelease=false -p:PublishReadyToRun=false --output "$env:RUNNER_TEMP/winzlee-v012"
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (!(Test-Path "$env:RUNNER_TEMP/winzlee-v012/Winzlee.exe")) { throw "Winzlee.exe missing" }

      - name: Bundle pinned official HatchZip 0.1.7 CLI (verified SHA-256)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "hatchzip-windows-v0.1.7.zip"
          $source = "https://github.com/xevrion/hatchzip/releases/download/v0.1.7/hatchzip-x86_64-windows.zip"
          Invoke-WebRequest -Uri $source -OutFile $download
          $actual = (Get-FileHash -Path $download -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "d7cc7c448cd803eaac606f7b09c20023453f231d3d0684429ecc25eab247d6d3"
          if ($actual -ne $expected) { throw "HatchZip release checksum mismatch: $actual" }
          $expanded = Join-Path $env:RUNNER_TEMP "hatchzip-expanded"
          Expand-Archive -Path $download -DestinationPath $expanded -Force
          $exe = Get-ChildItem $expanded -Recurse -File -Filter "hatchzip.exe" | Select-Object -First 1
          if (-not $exe) { throw "Official HatchZip CLI executable missing from verified archive" }
          $dest = Join-Path $env:RUNNER_TEMP "winzlee-v012/engines/hatchzip"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item $exe.FullName (Join-Path $dest "hatchzip.exe")
          foreach ($license in @("LICENSE-MIT", "LICENSE-APACHE", "LICENSE-UNRAR")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/xevrion/hatchzip/v0.1.7/$license" -OutFile (Join-Path $dest $license)
          }
          & (Join-Path $dest "hatchzip.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "HatchZip bundled executable not runnable" }

      - name: Include pinned 7-Zip console for extraction and 7z creation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Filee's existing engine downloader verifies the SHA-256 of official 7-Zip 26.03,
          # extracts the MSI without installing anything, and keeps 7z.exe, 7z.dll and its license.
          & ./app/build/fetch-engines.ps1 -Only 7zip -Destination "$env:RUNNER_TEMP/winzlee-v012/engines"
          # fetch-engines.ps1 throws on failure; LASTEXITCODE can retain a stale value from msiexec.
          $seven = Join-Path $env:RUNNER_TEMP "winzlee-v012/engines/7zip/7z.exe"
          if (!(Test-Path $seven)) { throw "7-Zip console not bundled" }
          & $seven i
          if ($LASTEXITCODE -ne 0) { throw "Bundled 7-Zip not runnable" }

      - name: Smoke test real HatchZip extraction on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "hatchzip-smoke"
          $inputFolder = Join-Path $work "input"
          New-Item -Path $inputFolder -ItemType Directory -Force | Out-Null
          "Winzlee HatchZip smoke test" | Set-Content (Join-Path $inputFolder "proof.txt")
          $archive = Join-Path $work "example.zip"
          Compress-Archive -Path (Join-Path $inputFolder "proof.txt") -DestinationPath $archive -Force
          $cli = Join-Path $env:RUNNER_TEMP "winzlee-v012/engines/hatchzip/hatchzip.exe"
          & $cli check $archive
          if ($LASTEXITCODE -ne 0) { throw "HatchZip preflight failed" }
          & $cli extract $archive --verify-first --yes
          if ($LASTEXITCODE -ne 0) { throw "HatchZip extraction failed" }
          if (Test-Path $archive) { throw "Space-saving extraction did not consume the test archive" }
          $proof = Get-ChildItem $work -Recurse -File -Filter proof.txt | Where-Object FullName -NotMatch '[\\/]input[\\/]'
          if (-not $proof) { throw "HatchZip extraction did not produce the expected file" }

      - name: Include source license and third-party notices
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "winzlee-v012"
          Copy-Item app/LICENSE (Join-Path $dest "LICENSE")
          Copy-Item app/THIRD-PARTY-NOTICES.md (Join-Path $dest "THIRD-PARTY-NOTICES.md")
          if (!(Test-Path (Join-Path $dest "LICENSE"))) { throw "License missing from package" }

      # Release candidate packages are built together from one version and one source tree.
      # This is deliberately manual: it publishes NO GitHub Release and does not
      # modify a user's PC. The installer still needs separate real-Windows validation.
      - name: Build both Winzlee 1.0.0 RC1 packages and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./app/build/build-installer.ps1 -Version "1.0.0-rc1" -Portable -OutputDir "$env:RUNNER_TEMP/winzlee-rc1-packages"
          if ($LASTEXITCODE -ne 0) { throw "RC1 package build failed" }
          $folder = Join-Path $env:RUNNER_TEMP "winzlee-rc1-packages"
          foreach ($name in @("Winzlee-1.0.0-rc1-win-Setup.exe", "Winzlee-1.0.0-rc1-win-Portable.zip", "Winzlee-1.0.0-rc1-SHA256SUMS.txt")) {
            if (!(Test-Path (Join-Path $folder $name))) { throw "Missing release candidate artifact: $name" }
          }
          $zip = Join-Path $folder "Winzlee-1.0.0-rc1-win-Portable.zip"
          $contents = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if (!($contents.Entries.FullName -contains "Winzlee.exe")) { throw "Portable ZIP missing Winzlee.exe" }
            if ($contents.Entries.FullName -contains "uninstall.exe") { throw "Portable ZIP contains installer-only files" }
          }
          finally { $contents.Dispose() }

      - name: Upload RC1 installer EXE and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Winzlee-1.0.0-RC1-installable-packages
          path: ${{ runner.temp }}/winzlee-rc1-packages/
          if-no-files-found: error
          retention-days: 3

      - name: Upload complete Winzlee RC1 portable preview
        uses: actions/upload-artifact@v4
        with:
          name: Winzlee-RC1-audit-win-x64-HatchZip-preview
          path: ${{ runner.temp }}/winzlee-v012/
          retention-days: 3

  # Intentionally does not publish a public release. This job is manual, runs
  # only on main, waits for all Windows checks and creates a DRAFT.
  # The maintainer must verify the binary files before publishing it.
  draft_rc1_release:
    name: Stage v1.0.0-rc1 as a draft (never publish automatically)
    needs: windows
    if: ${{ inputs.prepare_draft_release == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the same tested commit and its release notes
        uses: actions/checkout@v4

      - name: Download the installer, portable ZIP and checksums from this exact run
        uses: actions/download-artifact@v4
        with:
          name: Winzlee-1.0.0-RC1-installable-packages
          path: release-assets

      - name: Validate asset names, nonempty files and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s Winzlee-1.0.0-rc1-win-Setup.exe
          test -s Winzlee-1.0.0-rc1-win-Portable.zip
          test -s Winzlee-1.0.0-rc1-SHA256SUMS.txt
          test "$(wc -l < Winzlee-1.0.0-rc1-SHA256SUMS.txt)" -eq 2
          sha256sum --check --strict Winzlee-1.0.0-rc1-SHA256SUMS.txt
          # Avoid grep -q in a pipe under pipefail: unzip can receive SIGPIPE.
          unzip -tq Winzlee-1.0.0-rc1-win-Portable.zip
          unzip -Z1 Winzlee-1.0.0-rc1-win-Portable.zip > portable-files.txt
          grep -Fx 'Winzlee.exe' portable-files.txt
          if grep -E '(^|/)uninstall\.exe$' portable-files.txt; then
            echo 'The portable archive contains an uninstall program.'
            exit 1
          fi
          rm portable-files.txt

      - name: Create DRAFT pre-release for review (no automatic publication)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v1.0.0-rc1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: refusing to overwrite its assets."
            exit 1
          fi
          gh release create "$tag" \
            release-assets/Winzlee-1.0.0-rc1-win-Setup.exe \
            release-assets/Winzlee-1.0.0-rc1-win-Portable.zip \
            release-assets/Winzlee-1.0.0-rc1-SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Winzlee v1.0.0 RC1" \
            --notes-file docs/RELEASE-NOTES-v1.0.0-rc1.md \
            --draft \
            --prerelease
          echo "DRAFT staged. Verify its assets, tests and source disclosure before publication."
