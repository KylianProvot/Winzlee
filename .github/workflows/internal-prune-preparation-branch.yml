name: Internal - remove obsolete cleanroom preparation branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/internal-prune-preparation-branch.yml'
permissions:
  contents: write
jobs:
  remove-obsolete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the verified obsolete preparation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='release/cleanroom-rc1'
          expected='38bc3db4c681b2f1d1007538f823727b253916c1'
          actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Ref changed; refusing deletion ($actual)"
            exit 1
          fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          echo 'Only obsolete preparation branch deleted; main untouched.'
