name: Winzlee RC1 - Promote verified existing artifacts to draft

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "ID of validated RC1 build"
        required: true
        type: string
        default: '41417869823'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify the source run and successful Windows job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid source run ID'; exit 1; }
          source_meta="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")"
          echo "$source_meta" | jq -e --arg repo "$GH_REPO" '
            .repository.full_name == $repo and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .head_branch == "main" and
            .name == "Winzlee RC1 - Windows validation, packages and draft release"' >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" |
            jq -e '.jobs | any(.name == "windows" and .conclusion == "success")' >/dev/null

      - name: Download validated packages from the source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh run download "$SOURCE_RUN_ID" --name Winzlee-1.0.0-RC1-installable-packages --dir release-assets

      - name: Verify files, SHA-256 and portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s Winzlee-1.0.0-rc1-win-Setup.exe
          test -s Winzlee-1.0.0-rc1-win-Portable.zip
          test -s Winzlee-1.0.0-rc1-SHA256SUMS.txt
          test "$(wc -l < Winzlee-1.0.0-rc1-SHA256SUMS.txt)" -eq 2
          sha256sum --check --strict Winzlee-1.0.0-rc1-SHA256SUMS.txt
          unzip -tq Winzlee-1.0.0-rc1-win-Portable.zip
          unzip -Z1 Winzlee-1.0.0-rc1-win-Portable.zip > files.txt
          grep -Fx 'Winzlee.exe' files.txt
          if grep -E '(^|/)uninstall\.exe$' files.txt; then
            echo 'Portable archive contains uninstaller'; exit 1
          fi
          rm files.txt

      - name: Create DRAFT prerelease (never publish automatically)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0-rc1 >/dev/null 2>&1; then
            echo 'Release already exists: refusing to overwrite'; exit 1
          fi
          source_sha="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          gh release create v1.0.0-rc1 \
            release-assets/Winzlee-1.0.0-rc1-win-Setup.exe \
            release-assets/Winzlee-1.0.0-rc1-win-Portable.zip \
            release-assets/Winzlee-1.0.0-rc1-SHA256SUMS.txt \
            --target "$source_sha" \
            --title 'Winzlee v1.0.0 RC1' \
            --notes-file docs/RELEASE-NOTES-v1.0.0-rc1.md \
            --draft --prerelease
