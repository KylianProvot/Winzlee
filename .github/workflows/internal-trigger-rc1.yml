name: Internal - dispatch tested Winzlee RC1 release workflow once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/internal-trigger-rc1.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: \${{ github.repository == 'KylianProvot/Winzlee-Public' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'ci(internal): trigger validated RC1 draft build once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request official RC1 workflow with draft-release option
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-rc1.yml --ref main --field prepare_draft_release=true
          echo 'Requested RC1 workflow dispatch. This does NOT publish a release.'
